{% extends "base.html" %}

{% block title %}Analyse en cours - GL Normalizer{% endblock %}

{% block content %}
<div class="loading-container">
    <div class="loading-card">
        <h2>Analyse en cours</h2>
        <p class="year-info">Année {{ year }}</p>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <div class="status-message" id="statusMessage">
            Initialisation...
        </div>

        <div class="spinner" id="spinner">
            <div class="spinner-ring"></div>
        </div>

        <div class="error-message" id="errorMessage" style="display: none;">
            <p>Une erreur est survenue</p>
            <a href="/" class="btn btn-primary">Retour</a>
        </div>
    </div>
</div>

<style>
.loading-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60vh;
    padding: 2rem;
}

.loading-card {
    background: white;
    padding: 3rem;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    text-align: center;
    max-width: 500px;
    width: 100%;
}

.loading-card h2 {
    margin-bottom: 0.5rem;
    color: #333;
}

.year-info {
    color: #666;
    margin-bottom: 2rem;
}

.progress-container {
    margin: 2rem 0;
}

.progress-bar {
    height: 24px;
    background: #e9ecef;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #007bff, #0056b3);
    border-radius: 12px;
    transition: width 0.5s ease;
    width: 0%;
}

.progress-text {
    margin-top: 0.5rem;
    font-weight: bold;
    color: #007bff;
    font-size: 1.2rem;
}

.status-message {
    color: #666;
    font-size: 1rem;
    margin: 1.5rem 0;
    min-height: 1.5rem;
}

.spinner {
    display: flex;
    justify-content: center;
    margin: 2rem 0;
}

.spinner-ring {
    width: 50px;
    height: 50px;
    border: 4px solid #e9ecef;
    border-top: 4px solid #007bff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.error-message {
    background: #f8d7da;
    padding: 1.5rem;
    border-radius: 8px;
    margin-top: 1rem;
}

.error-message p {
    color: #721c24;
    margin-bottom: 1rem;
}

/* Phases d'analyse */
.phase-indicator {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    margin: 1rem 0;
}

.phase-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #e9ecef;
    transition: background 0.3s;
}

.phase-dot.active {
    background: #007bff;
}

.phase-dot.completed {
    background: #28a745;
}
</style>

<script>
const jobId = "{{ job_id }}";
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const statusMessage = document.getElementById('statusMessage');
const spinner = document.getElementById('spinner');
const errorMessage = document.getElementById('errorMessage');

let pollInterval;

async function checkStatus() {
    try {
        const response = await fetch(`/api/status/${jobId}`);
        const data = await response.json();

        // Mise à jour de la progression
        progressFill.style.width = `${data.progress}%`;
        progressText.textContent = `${data.progress}%`;
        statusMessage.textContent = data.message || 'Traitement...';

        // Si terminé
        if (data.ready) {
            clearInterval(pollInterval);
            statusMessage.textContent = 'Analyse terminée ! Redirection...';
            progressFill.style.background = 'linear-gradient(90deg, #28a745, #218838)';
            setTimeout(() => {
                window.location.href = `/results/${jobId}`;
            }, 500);
        }

        // Si erreur
        if (data.error) {
            clearInterval(pollInterval);
            spinner.style.display = 'none';
            errorMessage.style.display = 'block';
            statusMessage.textContent = data.message || 'Une erreur est survenue';
            progressFill.style.background = '#dc3545';
        }

    } catch (error) {
        console.error('Erreur lors de la vérification du statut:', error);
    }
}

// Démarrer le polling
pollInterval = setInterval(checkStatus, 1000);
checkStatus(); // Vérification immédiate
</script>
{% endblock %}
